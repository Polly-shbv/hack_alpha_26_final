services:
  alfa-context:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ALFA_AUTH_MODE: demo
      ALFA_CONTAINER_LOCAL: "1"
    volumes:
      - alfa-data:/app/data/local
    restart: unless-stopped
volumes:
  alfa-data:
